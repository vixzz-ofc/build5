name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PUB_CACHE: /opt/pub-cache

    steps:

      # =========================
      # SETUP NODE
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            --retry 3 --retry-delay 2 \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"
          ls -lh project.zip
          file project.zip
          xxd project.zip | head -2

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            cat project.zip
            exit 1
          fi
          echo "✅ ZIP valid"
          unzip -q project.zip -d project_raw
          find project_raw | head -50

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # =========================
      # DETECT FLUTTER VERSION
      # =========================
      - name: Detect Flutter version
        run: |
          PUBSPEC="$PROJECT_DIR/pubspec.yaml"
          FLUTTER_VER="3.47.6"

          if [ -f "$PUBSPEC" ]; then
            echo "=== environment block ==="
            grep -A 10 '^environment:' "$PUBSPEC" || true
            echo "========================="

            FLUTTER_VER=$(python3 - "$PUBSPEC" "$FLUTTER_VER" <<'PYEOF'
import sys, re

pubspec_path = sys.argv[1]
default_ver  = sys.argv[2]

try:
    with open(pubspec_path, 'r') as f:
        content = f.read()

    env_match = re.search(r'^environment:\s*\n((?:[ \t]+.+\n?)*)', content, re.MULTILINE)
    if not env_match:
        print(default_ver); sys.exit(0)

    env_block = env_match.group(1)
    flutter_match = re.search(r'flutter\s*:\s*["\']?([^"\'#\n]+)', env_block)
    if not flutter_match:
        print(default_ver); sys.exit(0)

    constraint = flutter_match.group(1).strip()
    versions = re.findall(r'(\d+)\.(\d+)(?:\.(\d+))?', constraint)
    if not versions:
        print(default_ver); sys.exit(0)

    major, minor, patch = versions[0]
    major, minor = int(major), int(minor)

    if major > 3 or (major == 3 and minor >= 47):   result = "3.47.6"
    elif major == 3 and minor >= 43:                 result = "3.43.0"
    elif major == 3 and minor >= 40:                 result = "3.40.0"
    elif major == 3 and minor >= 35:                 result = "3.40.0"
    elif major == 3 and minor >= 29:                 result = "3.32.0"
    elif major == 3 and minor >= 24:                 result = "3.27.4"
    elif major == 3 and minor >= 19:                 result = "3.22.0"
    else:                                            result = default_ver

    print(result)

except Exception:
    print(default_ver)
PYEOF
)
          fi

          echo "✅ Flutter version: $FLUTTER_VER"
          echo "FLUTTER_VERSION=$FLUTTER_VER" >> $GITHUB_ENV

      # =========================
      # JAVA + FLUTTER
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          channel: "stable"
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Pre-warm Flutter
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter precache --android --no-ios --no-web --no-linux --no-windows --no-macos 2>/dev/null || true
          echo "✅ $(flutter --version 2>&1 | head -1)"

      # =========================
      # PUB CACHE
      # =========================
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            /opt/pub-cache
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
            pub-${{ runner.os }}-

      # =========================
      # ANALYZE
      # =========================
      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          else
            echo "[RESULT_ANALYZE]"
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode aktif."
          exit 1

      # =========================
      # PUB GET
      # =========================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "☕ Bukan project Flutter standar, skip pub get!"
            exit 0
          fi

          echo "▶ flutter pub get (Flutter $FLUTTER_VERSION)..."
          flutter pub get --no-precompile 2>&1 | tee /tmp/pubget_out.log | tail -8

          if grep -qE "Failed to update packages|Try using the Flutter SDK version" /tmp/pubget_out.log; then
            echo "❌ pub get GAGAL — SDK mismatch, retry tanpa lock..."
            rm -rf .dart_tool pubspec.lock
            flutter pub get 2>&1 | tee /tmp/pubget_retry.log | tail -10
            if grep -qE "Failed to update packages" /tmp/pubget_retry.log; then
              echo "❌ Masih gagal setelah retry"
              cat /tmp/pubget_retry.log
              exit 1
            fi
          fi

          echo "✅ pub get done"

      # =========================
      # BUILD APK
      # =========================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Mode: ${{ github.event.inputs.build_type }}"
          echo "Flutter: $FLUTTER_VERSION"
          if [ -f "pubspec.yaml" ]; then
            flutter build apk \
              --${{ github.event.inputs.build_type }} \
              --no-pub \
              --suppress-analytics \
              --no-tree-shake-icons \
              2>&1 | tail -20
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: gradlew tidak ditemukan!"
              exit 1
            fi
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true" \
              ./gradlew assembleDebug --parallel --build-cache --no-daemon 2>&1 | tail -20
            else
              GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true" \
              ./gradlew assembleRelease --parallel --build-cache --no-daemon 2>&1 | tail -20
            fi
            cd -
          fi

      # =========================
      # CHECK APK
      # =========================
      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "Error: APK tidak ditemukan."
            exit 1
          fi
          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "✅ APK: $APK_PATH"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          ls -lh "$APK_FOUND"

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
