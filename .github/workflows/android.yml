name: Build Android Studio APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Android Studio (GitHub Release asset API URL)'
        required: true
      tag:
        description: 'Tag untuk release'
        required: true
      build_type:
        description: 'Tipe build: debug atau release'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g -XX:+UseG1GC"

    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download ZIP project
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o project.zip \
            --connect-timeout 30 \
            --retry 3 --retry-delay 2 \
            "${{ github.event.inputs.zip_url }}"
          echo "✅ ZIP downloaded: $(du -sh project.zip | cut -f1)"

      - name: Extract ZIP
        run: |
          unzip -q -o project.zip -d project_src
          rm project.zip
          echo "✅ Extracted $(find project_src -type f | wc -l) files"

      - name: Find project root
        id: find_root
        run: |
          ROOT=$(find project_src -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) ! -path "*/app/*" | head -1 | xargs dirname 2>/dev/null || echo "")
          if [ -z "$ROOT" ]; then
            FIRST=$(ls -d project_src/*/ 2>/dev/null | head -1)
            ROOT="${FIRST:-project_src}"
          fi
          echo "✅ Project root: $ROOT"
          echo "root=$ROOT" >> $GITHUB_OUTPUT

      - name: Grant gradlew permission
        run: |
          ROOT="${{ steps.find_root.outputs.root }}"
          if [ -f "$ROOT/gradlew" ]; then
            chmod +x "$ROOT/gradlew"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-v2
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Cache Android build
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.find_root.outputs.root }}/.gradle
            ${{ steps.find_root.outputs.root }}/app/build/intermediates
            ${{ steps.find_root.outputs.root }}/build
          key: android-out-${{ runner.os }}-${{ github.event.inputs.tag }}-v1
          restore-keys: |
            android-out-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: Build APK (${{ github.event.inputs.build_type }})
        run: |
          ROOT="${{ steps.find_root.outputs.root }}"
          cd "$ROOT"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          if [ -f "gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            $GRADLE_CMD assembleDebug \
              --parallel --build-cache --no-daemon \
              --configuration-cache 2>&1 | tail -25
          else
            $GRADLE_CMD assembleRelease \
              --parallel --build-cache --no-daemon \
              --configuration-cache 2>&1 | tail -25
          fi
          echo "✅ Build completed"

      - name: Find APK output
        id: find_apk
        run: |
          ROOT="${{ steps.find_root.outputs.root }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK=$(find "$ROOT" -name "*debug*.apk" | head -1)
          else
            APK=$(find "$ROOT" -name "*release*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find "$ROOT" -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi
          echo "✅ APK: $APK ($(du -sh "$APK" | cut -f1))"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.event.inputs.tag }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 1
          compression-level: 0
