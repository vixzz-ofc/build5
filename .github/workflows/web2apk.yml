name: Web2APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'Icon Url'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Create Flutter Project
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          PKG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | tr -cd '[:alnum:]_')
          flutter create --org com.webapk --project-name "$PKG" myapp

      - name: Add Assets and Dependencies
        run: |
          cd myapp
          flutter pub add webview_flutter
          flutter pub add flutter_launcher_icons
          flutter pub add connectivity_plus
          mkdir -p assets/icon
          printf '  assets:\n    - assets/icon/\n' >> pubspec.yaml

      - name: Write main.dart
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          WEB_URL: ${{ github.event.inputs.web_url }}
          DART_B64: >-
            
        run: |
          echo "$DART_B64" | base64 -d > myapp/lib/main.dart
          sed -i "s|APPNAME|$APP_NAME|g"  myapp/lib/main.dart
          sed -i "s|WEBURL|$WEB_URL|g"    myapp/lib/main.dart
          echo "main.dart written OK"

      - name: Fix Android Permissions and App Name
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          MANIFEST="myapp/android/app/src/main/AndroidManifest.xml"
          grep -q "INTERNET" "$MANIFEST" || \
            sed -i '/<manifest xmlns:android/a\    <uses-permission android:name=\"android.permission.INTERNET\"\/>' "$MANIFEST"
          grep -q "ACCESS_NETWORK_STATE" "$MANIFEST" || \
            sed -i '/<manifest xmlns:android/a\    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"\/>' "$MANIFEST"
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" "$MANIFEST"

      - name: Setup Network Security
        run: |
          mkdir -p myapp/android/app/src/main/res/xml
          printf '%s' '<?xml version="1.0" encoding="utf-8"?><network-security-config><base-config cleartextTrafficPermitted="true"><trust-anchors><certificates src="system"/></trust-anchors></base-config></network-security-config>' \
            > myapp/android/app/src/main/res/xml/network_security_config.xml
          sed -i 's/<application/<application android:networkSecurityConfig=\"@xml\/network_security_config\"/' \
            myapp/android/app/src/main/AndroidManifest.xml

      - name: Download and Process Icon
        run: |
          mkdir -p myapp/assets/icon
          sudo apt-get install -y imagemagick -q
          curl -L -A "Mozilla/5.0" --max-redirs 10 \
            "${{ github.event.inputs.icon_url }}" \
            -o myapp/assets/icon/icon_raw
          convert myapp/assets/icon/icon_raw \
            -background white -alpha remove \
            -gravity center -resize 1024x1024 -extent 1024x1024 \
            PNG:myapp/assets/icon/icon.png
          echo "Icon OK: $(wc -c < myapp/assets/icon/icon.png) bytes"

      - name: Write launcher icons config
        run: |
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/icon/icon.png"\n  min_sdk_android: 21\n' \
            > myapp/flutter_launcher_icons.yaml

      - name: Generate Icons
        run: |
          cd myapp
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Build APK
        run: |
          cd myapp
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-release
          path: myapp/build/app/outputs/flutter-apk/app-release.apk
